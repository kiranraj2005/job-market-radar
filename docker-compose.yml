services:
  db:
    image: pgvector/pgvector:pg16
    container_name: job-market-db
    environment:
      POSTGRES_DB: jobmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pipeline/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmarket"]
      interval: 2s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    container_name: job-market-pipeline
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: